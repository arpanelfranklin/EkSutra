apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-b
  namespace: govt-ip
  labels:
    app: system-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-b
  template:
    metadata:
      labels:
        app: system-b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: system-b
          image: arpanel/system-b:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-b
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-b
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-b
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
