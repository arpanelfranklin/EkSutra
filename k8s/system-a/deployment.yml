apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-a
  namespace: govt-ip
  labels:
    app: system-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-a
  template:
    metadata:
      labels:
        app: system-a
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: system-a
          image: arpanel/system-a:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-a
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-a
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-a
            - name: EKSUTRA_URL
              value: "http://backend-service.govt-ip.svc.cluster.local:8080/api/v1/integration/applications"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
