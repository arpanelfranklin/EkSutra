apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-c
  namespace: govt-ip
  labels:
    app: system-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-c
  template:
    metadata:
      labels:
        app: system-c
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: system-c
          image: arpanel/system-c:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-c
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-c
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-uri-system-c
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
