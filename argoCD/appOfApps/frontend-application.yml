kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: frontend-application
  namespace: argocd
spec:
  project: govt-ip-project
  source:
    repoURL: https://github.com/arpanelfranklin/EkSutra.git
    targetRevision: main
    path: k8s/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: govt-ip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
