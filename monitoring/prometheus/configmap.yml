kind: ConfigMap 
apiVersion: v1
metadata: 
  name: prometheus-configmap 
  namespace: monitoring 
data: 
  prometheus.yml: |
    global: 
      scrape_interval: 15s 
      evaluation_interval: 15s

    scrape_configs: 
      - job_name: 'prometheus' 
        static_configs: 
          - targets: ['localhost:9090']
            labels: 
              app: prometheus 

      - job_name: 'node-exporter' 
        static_configs: 
          - targets: ['node-exporter-service.monitoring.svc.cluster.local:9100']
            labels: 
              app: node-exporter 

      - job_name: 'integration-plateform' 
        metrics_path: '/actuator/prometheus'
        static_configs: 
          - targets: ['backend-service.govt-ip.svc.cluster.local:8080']
            labels: 
              app: integration-plateform

      - job_name: 'system-a' 
        metrics_path: '/actuator/prometheus'
        static_configs: 
          - targets: ['system-a-service.govt-ip.svc.cluster.local:8081']
            labels: 
              app: system-a

      - job_name: 'system-b' 
        metrics_path: '/actuator/prometheus'
        static_configs: 
          - targets: ['system-b-service.govt-ip.svc.cluster.local:8082']
            labels: 
              app: system-b

      - job_name: 'system-c' 
        metrics_path: '/actuator/prometheus'
        static_configs: 
          - targets: ['system-c-service.govt-ip.svc.cluster.local:8083']
            labels: 
              app: system-c

      - job_name: 'kubernetes-nodes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name